# Static site. No database, no secrets, no state - the whole app is a folder of
# JSON and one script.
#
# Deploy with:
#   npm run build && fly deploy
#
# `npm run build` runs scripts/check-publishable.mjs first, which refuses if
# data/derived holds artifacts carrying genotype calls. That check is the only
# thing standing between a local build and publishing data the 1001 Genomes
# terms do not clearly permit, so do not bypass it by deploying a stale dist/.

app = "coldframe"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Nothing is held in memory between requests, so idling to zero costs nothing
  # but a cold start on the next visit.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
