server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The locus artifacts are several megabytes of JSON and compress to a small
    # fraction of that, so this is the difference between a usable page and a
    # slow one.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_vary on;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Artifacts are not hashed and change when loci are rebuilt.
    location ~ \.json$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here loads a third-party resource, so say so.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
